name: Build APK

on:
  push:
    branches: [main, arena/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Debug APK
        working-directory: WebViewApp
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -30
          echo "=== Build result: $? ==="
          find . -name "*.apk" -type f 2>/dev/null
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Copy APK
        run: |
          APK=$(find WebViewApp -name "*.apk" -type f 2>/dev/null | head -1)
          echo "Found APK: $APK"
          if [ -n "$APK" ]; then
            cp "$APK" CryptoSignalAIPro.apk
            ls -lh CryptoSignalAIPro.apk
          else
            echo "No APK found!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSignalAIPro
          path: CryptoSignalAIPro.apk
          retention-days: 90

  release:
    name: Publish APK
    needs: build-apk
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: CryptoSignalAIPro

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-apk
          name: "🤖 CryptoSignal AI Pro - Latest APK"
          body: |
            ## Download APK

            **[CryptoSignalAIPro.apk](../../releases/download/latest-apk/CryptoSignalAIPro.apk)**

            ### Features
            - Live crypto signals with 10 technical indicators
            - Background trading bot with auto-trade
            - Paper trading mode (safe by default)
            - Real-time price monitoring
            - Risk management & panic button
            - Fear & Greed index
            - Binance API integration

            ### Install
            1. Download APK
            2. Install on Android phone
            3. Open → Start trading
          files: CryptoSignalAIPro.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}