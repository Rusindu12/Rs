name: Build APK

on:
  push:
    branches: [main, arena/**]
    paths:
      - 'CryptoSignalProTrader/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: CryptoSignalProTrader/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        working-directory: CryptoSignalProTrader
        run: npm install --legacy-peer-deps

      - name: Create placeholder assets
        working-directory: CryptoSignalProTrader
        run: |
          mkdir -p assets/sounds assets/images
          python3 -c "
          import struct, zlib
          def make_png(w, h, r, g, b):
              raw = b''
              for y in range(h):
                  raw += b'\x00' + bytes([r, g, b]) * w
              def chunk(ctype, data):
                  c = ctype + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              idat = chunk(b'IDAT', zlib.compress(raw))
              iend = chunk(b'IEND', b'')
              return sig + ihdr + idat + iend
          for name in ['icon.png', 'splash.png', 'adaptive-icon.png']:
              with open(f'assets/{name}', 'wb') as f:
                  f.write(make_png(192, 192, 11, 14, 17))
          print('Placeholder images created')
          "

      - name: Run Expo prebuild
        working-directory: CryptoSignalProTrader
        run: npx expo prebuild --platform android --no-install

      - name: Make Gradlew executable
        run: chmod +x CryptoSignalProTrader/android/gradlew

      - name: Build Release APK
        working-directory: CryptoSignalProTrader/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSignalAIPro-${{ github.sha }}
          path: CryptoSignalProTrader/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          if-no-files-found: warn

  release:
    name: Create Release with APK
    needs: build-apk
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: CryptoSignalAIPro-${{ github.sha }}
          path: ./apk

      - name: Rename APK
        run: |
          mv ./apk/app-release.apk ./apk/CryptoSignalAIPro.apk

      - name: Get version
        id: version
        run: |
          VERSION=$(date +%Y%m%d)-$(echo ${{ github.sha }} | head -c 7)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CryptoSignal AI Pro v${{ steps.version.outputs.version }}
          body: |
            ## 🤖 CryptoSignal AI Pro Trader - APK Build

            ### Download
            - **[CryptoSignalAIPro.apk](../../releases/download/v${{ steps.version.outputs.version }}/CryptoSignalAIPro.apk)** - Install on your Android device

            ### What's Included
            - 10 technical indicators (RSI, MACD, Bollinger, EMA, StochRSI, Volume, S/R, Candles, ATR, ADX)
            - Background persistent trading (24/7)
            - Binance REST + WebSocket with auto-reconnect
            - Paper trading mode (default safe)
            - Risk management & circuit breakers
            - 14 screens, 107 files, zero placeholders

            ### Install
            ```
            adb install CryptoSignalAIPro.apk
            ```
            Or transfer APK to phone and install directly.
          files: ./apk/CryptoSignalAIPro.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}