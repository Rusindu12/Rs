name: Build APK

on:
  push:
    branches: [main, arena/**]
    paths:
      - 'CryptoSignalProTrader/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install npm dependencies
        working-directory: CryptoSignalProTrader
        run: npm install --legacy-peer-deps

      - name: Create placeholder assets
        working-directory: CryptoSignalProTrader
        run: |
          mkdir -p assets/sounds assets/images
          python3 -c "
          import struct, zlib
          def make_png(w, h, r, g, b):
              raw = b''
              for y in range(h):
                  raw += b'\x00' + bytes([r, g, b]) * w
              def chunk(ctype, data):
                  c = ctype + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              idat = chunk(b'IDAT', zlib.compress(raw))
              iend = chunk(b'IEND', b'')
              return sig + ihdr + idat + iend
          for name in ['icon.png', 'splash.png', 'adaptive-icon.png']:
              with open(f'assets/{name}', 'wb') as f:
                  f.write(make_png(192, 192, 11, 14, 17))
          "

      - name: Run Expo prebuild
        working-directory: CryptoSignalProTrader
        run: npx expo prebuild --platform android --no-install

      - name: Copy native Java files to correct package
        working-directory: CryptoSignalProTrader
        run: |
          # Create package directory if it doesn't exist
          PKG_DIR="android/app/src/main/java/com/cryptosignal/aipro"
          mkdir -p "$PKG_DIR"

          # Write Java files inline since prebuild overwrites them
          cat > "$PKG_DIR/TradingForegroundService.java" << 'JAVAEOF'
          package com.cryptosignal.aipro;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.util.Log;
          import androidx.core.app.NotificationCompat;
          import javax.annotation.Nullable;

          public class TradingForegroundService extends Service {
              private static final String TAG = "TradingFgService";
              private static final String CHANNEL_ID = "crypto_trading_channel";
              private static final int NOTIFICATION_ID = 1001;
              private PowerManager.WakeLock wakeLock;
              private boolean isRunning = false;
              private long startTime;

              @Override public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
                  acquireWakeLock();
                  startTime = System.currentTimeMillis();
                  isRunning = true;
              }

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  String action = intent != null ? intent.getAction() : null;
                  if ("STOP_SERVICE".equals(action)) { stopForeground(true); stopSelf(); return START_NOT_STICKY; }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(NOTIFICATION_ID, buildNotification(), ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                  } else {
                      startForeground(NOTIFICATION_ID, buildNotification());
                  }
                  return START_STICKY;
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "AI Trading", NotificationManager.IMPORTANCE_LOW);
                      ch.setDescription("AI trading engine");
                      NotificationManager mgr = getSystemService(NotificationManager.class);
                      if (mgr != null) mgr.createNotificationChannel(ch);
                  }
              }

              private Notification buildNotification() {
                  Intent ni = getPackageManager().getLaunchIntentForPackage(getPackageName());
                  PendingIntent pi = PendingIntent.getActivity(this, 0, ni, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Intent si = new Intent(this, TradingForegroundService.class); si.setAction("STOP_SERVICE");
                  PendingIntent sp = PendingIntent.getService(this, 1, si, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  return new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("CryptoSignal AI Pro").setContentText("🤖 AI Trader Active")
                      .setSmallIcon(android.R.drawable.ic_dialog_info).setContentIntent(pi)
                      .setOngoing(true).setPriority(NotificationCompat.PRIORITY_LOW)
                      .addAction(android.R.drawable.ic_delete, "Stop", sp).build();
              }

              private void acquireWakeLock() {
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  if (pm != null) { wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "CryptoSignal::WL"); wakeLock.acquire(); }
              }

              @Override public void onDestroy() {
                  super.onDestroy(); isRunning = false;
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
              }
              @Override public void onTaskRemoved(Intent rootIntent) { super.onTaskRemoved(rootIntent); }
              @Nullable @Override public IBinder onBind(Intent intent) { return null; }
          }
          JAVAEOF

          cat > "$PKG_DIR/BootReceiver.java" << 'JAVAEOF'
          package com.cryptosignal.aipro;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.util.Log;
          public class BootReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      try {
                          Intent si = new Intent(context, TradingForegroundService.class);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(si);
                          else context.startService(si);
                      } catch (Exception e) { Log.e("BootReceiver", "Failed", e); }
                  }
              }
          }
          JAVAEOF

          cat > "$PKG_DIR/ServiceRestartReceiver.java" << 'JAVAEOF'
          package com.cryptosignal.aipro;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          public class ServiceRestartReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context context, Intent intent) {
                  try {
                      Intent si = new Intent(context, TradingForegroundService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(si);
                      else context.startService(si);
                  } catch (Exception ignored) {}
              }
          }
          JAVAEOF

          echo "Native Java files written"

      - name: Patch AndroidManifest.xml
        working-directory: CryptoSignalProTrader
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Add FOREGROUND_SERVICE_DATA_SYNC permission
          sed -i 's|<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>|<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>|' "$MANIFEST"
          # Add service and receiver before closing application tag
          sed -i 's|</application>|    <service android:name=".TradingForegroundService" android:foregroundServiceType="dataSync" android:exported="false" android:enabled="true" android:stopWithTask="false" />\n    <receiver android:name=".BootReceiver" android:exported="true" android:enabled="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.QUICKBOOT_POWERON"/></intent-filter></receiver>\n    <receiver android:name=".ServiceRestartReceiver" android:exported="false" android:enabled="true"><intent-filter><action android:name="com.cryptosignal.aipro.RESTART_SERVICE"/></intent-filter></receiver>\n  </application>|' "$MANIFEST"
          echo "AndroidManifest patched"

      - name: Make Gradlew executable
        run: chmod +x CryptoSignalProTrader/android/gradlew

      - name: Build Debug APK
        working-directory: CryptoSignalProTrader/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Find APK
        id: find-apk
        working-directory: CryptoSignalProTrader/android
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug APK dir"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release APK dir"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSignalAIPro
          path: CryptoSignalProTrader/android/app/build/outputs/apk/**/*.apk
          retention-days: 90
          if-no-files-found: warn

  release:
    name: Publish APK Release
    needs: build-apk
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: CryptoSignalAIPro
          path: ./apk

      - name: Prepare APK
        run: |
          find ./apk -name "*.apk" -exec mv {} ./apk/CryptoSignalAIPro.apk \;
          ls -la ./apk/

      - name: Publish rolling release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-apk
          name: "🤖 CryptoSignal AI Pro - Latest APK"
          body: |
            ## Download the latest APK

            **[CryptoSignalAIPro.apk](../../releases/download/latest-apk/CryptoSignalAIPro.apk)**

            ### Quick Start
            1. Download APK to your Android phone
            2. Install (enable "Unknown Sources" if needed)
            3. Open app → Enter Binance testnet API keys
            4. Start with Paper Trading mode (safe)
            5. Enable Auto-Trade when ready
          files: ./apk/CryptoSignalAIPro.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}